name: PS5 Slim takip

on:
  schedule:
    - cron: "*/15 * * * *"     # 15 dakikada bir (GitHub yoğunken birkaç dakika gecikebilir)
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal kontrol, test-message = Telegram test mesajı, heartbeat = 'sistem çalışıyor' mesajını şimdi gönder"
        type: choice
        options: [run, test-message, heartbeat]
        default: run

permissions:
  contents: write    # state.json'u (görülen fırsatlar) depoya geri yazmak için

concurrency:
  group: ps5-takip
  cancel-in-progress: false

jobs:
  takip:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Filtre testleri
        run: python -m unittest discover -s tests
      - name: Kontrol
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRICE_LIMIT: ${{ vars.PRICE_LIMIT }}
        run: python tracker.py "${{ inputs.mode || 'run' }}"
      - name: Durumu kaydet
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "ps5-takip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "durum güncellendi [skip ci]" -q
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
